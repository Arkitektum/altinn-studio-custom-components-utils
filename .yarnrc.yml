approvedGitRepositories:
  - "**"

enableScripts: true

# Yarn's bundled `got` crashes the whole process when a request times out and the
# scheduled retry fires after the request promise has settled ("The `onCancel`
# handler was attached after the promise settled"). A longer timeout and fewer
# parallel requests keep the fetch step out of that code path on flaky runners.
httpTimeout: 600000
networkConcurrency: 8

nodeLinker: node-modules

npmMinimalAgeGate: 0
