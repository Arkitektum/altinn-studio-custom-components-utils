name: Publish Node.js Package

on:
    release:
        types: [created]

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    publish-npm-package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org/

            # Enable Corepack and activate the Yarn version from package.json
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            # A registry timeout can crash Yarn outright instead of failing one
            # fetch, so retry the whole install rather than trusting Yarn's own
            # retries to recover.
            - name: Install dependencies
              run: |
                  for attempt in 1 2 3; do
                      yarn install --immutable && exit 0
                      echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
                      sleep 15
                  done
                  exit 1

            - name: Run tests
              run: yarn test

            - name: Build project
              if: ${{ success() }}
              run: yarn build

            - name: Configure npm auth
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
                  npm whoami
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_NPM_TOKEN }}

            - name: Publish to npm
              if: ${{ success() }}
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_NPM_TOKEN }}
