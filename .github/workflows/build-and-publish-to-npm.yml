name: Publish Node.js Package

on:
    release:
        types: [created]

# id-token for npm trusted publishing (OIDC). Nothing here writes to GitHub Packages, so no packages scope.
permissions:
    contents: read
    id-token: write

jobs:
    publish-npm-package:
        runs-on: ubuntu-latest
        # Waits for a reviewer to approve before anything runs, so creating a release is not on its own enough to publish.
        environment: release

        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # No registry-url here on purpose: it makes setup-node write an
            # .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
            # which makes npm think the registry already has auth configured and
            # skip the OIDC exchange that trusted publishing relies on.
            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: "24"

            # A release whose tag does not name the version in package.json would publish that version under the wrong
            # release, or fail at the registry after everything else has run, so it stops here first.
            - name: Check that the release tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::The release is tagged $TAG, but package.json says $version."
                    exit 1
                  fi

            # Enable Corepack and activate the Yarn version from package.json
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            # A registry timeout can crash Yarn outright instead of failing one
            # fetch, so retry the whole install rather than trusting Yarn's own
            # retries to recover.
            - name: Install dependencies
              run: |
                  for attempt in 1 2 3; do
                      yarn install --immutable && exit 0
                      echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
                      sleep 15
                  done
                  exit 1

            - name: Run tests
              run: yarn test

            - name: Build project
              if: ${{ success() }}
              run: yarn build

            # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange. Held to major 11 rather than @latest, so a new npm
            # major does not arrive unreviewed in the one job that can publish.
            - name: Ensure npm supports trusted publishing
              run: |
                  npm install -g npm@11
                  npm --version

            # No NODE_AUTH_TOKEN: npm authenticates through OIDC as the trusted
            # publisher configured on npmjs.com. Even an empty token env var
            # disables that exchange. If this ever fails with ENEEDAUTH, rerun
            # with --loglevel verbose to see the "npm verbose oidc" lines: the
            # trusted publisher fields (owner, repo, workflow filename,
            # environment) are matched exactly and are case-sensitive.
            - name: Publish to npm
              if: ${{ success() }}
              run: npm publish --provenance --access public
