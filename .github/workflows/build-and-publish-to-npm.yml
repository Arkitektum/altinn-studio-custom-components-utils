name: Publish Node.js Package

on:
    release:
        types: [created]

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    publish-npm-package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # No registry-url here on purpose: it makes setup-node write an
            # .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
            # which makes npm think the registry already has auth configured and
            # skip the OIDC exchange that trusted publishing relies on.
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            # Enable Corepack and activate the Yarn version from package.json
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            # A registry timeout can crash Yarn outright instead of failing one
            # fetch, so retry the whole install rather than trusting Yarn's own
            # retries to recover.
            - name: Install dependencies
              run: |
                  for attempt in 1 2 3; do
                      yarn install --immutable && exit 0
                      echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
                      sleep 15
                  done
                  exit 1

            - name: Run tests
              run: yarn test

            - name: Build project
              if: ${{ success() }}
              run: yarn build

            # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange.
            - name: Ensure npm supports trusted publishing
              run: |
                  npm install -g npm@latest
                  npm --version

            # npm reports every trusted-publishing failure as a generic
            # ENEEDAUTH/404, so print the preconditions it silently checks.
            - name: Check trusted publishing preconditions
              run: |
                  echo "npm version: $(npm --version)"
                  echo "workflow file: ${GITHUB_WORKFLOW_REF}"
                  echo "OIDC endpoint available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO (id-token: write missing)}"
                  echo "--- npm config (auth must be absent) ---"
                  npm config list
                  for f in ~/.npmrc ./.npmrc "${NPM_CONFIG_USERCONFIG}"; do
                      if [ -n "$f" ] && [ -f "$f" ]; then
                          echo "--- $f ---"
                          sed 's/=.*/=<redacted>/' "$f"
                      fi
                  done

            # No NODE_AUTH_TOKEN: npm authenticates through OIDC as the trusted
            # publisher. Even an empty token env var disables that exchange.
            # --loglevel verbose surfaces the "npm verbose oidc" lines that say
            # whether the token exchange was attempted and why it failed.
            - name: Publish to npm
              if: ${{ success() }}
              run: npm publish --provenance --access public --loglevel verbose
