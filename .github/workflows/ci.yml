name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            # Completely remove Yarn 1 so Corepack takes over
            - name: Remove preinstalled Yarn 1
              run: sudo rm -f /usr/local/bin/yarn /usr/local/bin/yarnpkg || true

            - name: Enable Corepack
              run: corepack enable

            - name: Verify Yarn version
              run: yarn --version

            # A registry timeout can crash Yarn outright instead of failing one fetch,
            # so retry the whole install rather than trusting Yarn's own retries to
            # recover.
            - name: Install dependencies
              run: |
                  for attempt in 1 2 3; do
                      yarn install --immutable && exit 0
                      echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
                      sleep 15
                  done
                  exit 1

            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test

            - name: Build package
              run: yarn build
